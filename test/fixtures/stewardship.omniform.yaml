apiVersion: omniform.org/v1alpha1
kind: Company
metadata: { id: example_company, name: Example Company }
spec:
  governance:
    desiredState:
      repository: https://github.com/example/example-company.git
      branch: main
      path: omniform.yaml
      changeMode: pull_request
  stewardship:
    capability: company_stewardship
    realisation: primary_stewardship
    autonomy:
      mode: autonomous_safe
      activeFrom: 2026-09-01T00:00:00Z
      expiresAt: 2026-09-02T00:00:00Z
      stateReference: stewardship_control
      triggers: [owner_request, interval, observed_drift, capability_gap, failed_operation]
      limits: { concurrency: 2, dailyChanges: 5, repairRounds: 2, actions: 20 }
      gates: { validation: true, independentReview: true, unchangedHead: true, successfulChecks: true }
      protectedCategories: [authority, governance, secrets, destructive_actions, spending_limits, autonomy_policy]
      duties:
        - { actor: steward, permissions: [propose] }
        - { actor: independent_reviewer, permissions: [approve] }
        - { actor: change_executor, permissions: [merge] }
        - { actor: reconciliation_executor, permissions: [apply] }
        - { actor: observer, permissions: [observe] }
      afterMerge: { reconcile: true, observe: true }
  providers:
    agents: { provider: example_company }
    inference: { provider: google }
    policies: { provider: example_company }
  capabilities:
    - id: company_stewardship
      name: Company Stewardship
      requires:
        - { id: stewardship_agency, primitiveFamily: agents }
        - { id: language_reasoning, primitiveFamily: inference }
        - { id: governed_authority, primitiveFamily: policies }
      realisations: [primary_stewardship]
  realisations:
    - id: primary_stewardship
      name: Primary stewardship
      capability: company_stewardship
      participants:
        - { resource: steward, role: steward, supplies: [stewardship_agency] }
        - { resource: steward_inference, supplies: [language_reasoning] }
        - { resource: steward_policy, supplies: [governed_authority] }
  resources:
    agents:
      - id: steward
        name: Company Steward
        offers: [stewardship_agency]
        spec:
          kind: ai_agent
          implementation: { framework: LiteLLM }
    inference:
      - id: steward_inference
        name: Steward inference
        provider: google
        offers: [language_reasoning]
        spec:
          product: Gemini API
          model: gemini-2.5-flash
          credentialReference: GEMINI_API_KEY
    policies:
      - id: steward_policy
        name: Steward authority
        offers: [governed_authority]
        spec: { deny: [approve, self_escalate, direct_provider_mutation] }
  operations:
    - id: inspect_company
      capability: company_stewardship
      description: Inspect current company truth.
      input: { type: object }
      output: { type: object }
      mutation: false
      permissions: [company.read]
      approval: none
      interfaces: [agent, api, ui]
