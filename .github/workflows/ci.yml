name: CI
on: {pull_request: {}, push: {branches: [main]}}
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: git clone --depth 1 https://github.com/mikeajijola/omniform.git ../omniform
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run omniseed -- validate examples/minimal --json
      - run: npm run omniseed -- plan examples/minimal --json
