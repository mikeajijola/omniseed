name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version already committed on main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Require Trusted Publishing-capable npm
        run: node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && v[1]<5) || (v[0]===11 && v[1]===5 && v[2]<1)) process.exit(1)"
      - run: npm ci
      - run: npm test
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json'); if(p.version!==process.env.RELEASE_VERSION) throw new Error('Requested version does not match package.json')"
      - run: npm publish --access public --tag alpha
