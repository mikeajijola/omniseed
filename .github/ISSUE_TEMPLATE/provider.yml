name: Provider or integration proposal
description: Propose an external implementation of runtime capabilities
labels: ["type:proposal", "area:provider"]
body:
  - type: textarea
    id: capability
    attributes: {label: Capability and external system}
    validations: {required: true}
  - type: textarea
    id: lifecycle
    attributes: {label: Validate, plan, apply, and observe behaviour}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: State, evidence, security, and test approach}
    validations: {required: true}
